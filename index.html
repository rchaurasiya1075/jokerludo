<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JokerLudo — room chat</title>
<style>
  :root {
    --ink: #100c14;
    --card: #221c2c;
    --line: #3a3148;
    --text: #f7f3fb;
    --muted: #b3a8c2;
    --green: #6d28d9;
    --mint: #c4b5fd;
    --gold: #f0c14d;
    --me: #4c1d95;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: #16111e; position: relative; }
  .gate { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px; gap: 14px; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(145deg, #6d28d9, #f0c14d); display: grid; place-items: center; font-weight: 800; font-size: 28px; color: #1a1024; }
  h1 { margin: 8px 0 0; font-size: 32px; letter-spacing: -0.04em; }
  p.lead { margin: 0; color: var(--muted); line-height: 1.45; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  input, select { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
  input:focus, select:focus { border-color: var(--mint); }
  .btn { border: 0; border-radius: 12px; padding: 12px 14px; background: var(--green); color: white; font-weight: 700; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.gold { background: var(--gold); color: #1c1406; }
  .btn.small { padding: 8px 10px; border-radius: 10px; font-size: 13px; }
  header.top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #1b1524; }
  .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #3b2a55; font-weight: 700; }
  .top h2 { margin: 0; font-size: 16px; }
  .top small { color: var(--muted); }
  main { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .sys { align-self: center; background: #2c2438; color: #ddd4ea; font-size: 12px; padding: 6px 10px; border-radius: 10px; max-width: 90%; text-align: center; }
  .err { align-self: center; background: #3a2228; color: #f3c2c2; font-size: 12px; padding: 8px 10px; border-radius: 10px; }
  .bubble { max-width: 78%; padding: 8px 10px; border-radius: 12px; background: var(--card); }
  .bubble.me { align-self: flex-end; background: var(--me); }
  .bubble .who { font-size: 11px; color: var(--gold); margin-bottom: 2px; }
  .bubble .time { display: block; text-align: right; font-size: 10px; color: #d5cbe4; margin-top: 4px; }
  .card { background: linear-gradient(180deg, #322848, #221c2c); border: 1px solid #5b4780; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card .tag { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
  .row { display: flex; gap: 8px; align-items: center; }
  .code { font-family: ui-monospace, monospace; letter-spacing: 0.14em; font-size: 20px; background: #120e18; border-radius: 10px; padding: 8px 10px; flex: 1; }
  .timer { color: var(--mint); font-variant-numeric: tabular-nums; font-weight: 700; }
  .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: #1b1524; }
  .composer input { flex: 1; }
  nav.bot { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: #140f1c; }
  nav.bot button { background: transparent; border: 0; padding: 10px 4px 12px; color: var(--muted); font-size: 12px; }
  nav.bot button.on { color: var(--mint); }
  .sheet { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; }
  .sheet form { width: 100%; background: #211a2c; border-radius: 18px 18px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .list-item { background: var(--card); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .pill { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: #3a2d52; color: var(--mint); width: fit-content; }
  .note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, onSnapshot, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBHo2Uz4bs29gmwQI6Tm0_Ll9X3_15e4tY",
  authDomain: "jokerludo-bf60f.firebaseapp.com",
  projectId: "jokerludo-bf60f",
  storageBucket: "jokerludo-bf60f.firebasestorage.app",
  messagingSenderId: "1071795638170",
  appId: "1:1071795638170:web:7b88fc0959642ebb1cf423"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const GAMES = ["Ludo King", "Carrom", "Chess"];
const MODES = ["Classic", "Quick", "Arrow"];
const TIMER_MS = 15 * 60 * 1000;

let me = null;
let tab = "chat";
let sheet = null;
let error = "";
let messages = [];
let matches = [];
let members = [];

function uid() {
  let id = localStorage.getItem("jokerludo_uid");
  if (!id) {
    id = "u" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("jokerludo_uid", id);
  }
  return id;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """ }[c]));
}
function time(ts) {
  const ms = ts && ts.toMillis ? ts.toMillis() : Number(ts) || Date.now();
  return new Date(ms).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
}
function remain(match) {
  const start = match.codeAt && match.codeAt.toMillis ? match.codeAt.toMillis() : Number(match.codeAt);
  if (!start) return "";
  const left = Math.max(0, TIMER_MS - (Date.now() - start));
  const m = Math.floor(left / 60000);
  const s = Math.floor((left % 60000) / 1000);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function listen() {
  onSnapshot(query(collection(db, "rooms", "main", "messages"), orderBy("at", "asc")), (snap) => {
    messages = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (e) => { error = e.message; render(); });
  onSnapshot(query(collection(db, "rooms", "main", "matches"), orderBy("createdAt", "desc")), (snap) => {
    matches = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (e) => { error = e.message; render(); });
  onSnapshot(collection(db, "rooms", "main", "members"), (snap) => {
    const now = Date.now();
    members = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => now - (m.seen || 0) < 120000);
    render();
  });
}

async function join(name) {
  me = { id: uid(), name: name.slice(0, 24) };
  localStorage.setItem("jokerludo_name", me.name);
  await setDoc(doc(db, "rooms", "main", "members", me.id), { name: me.name, seen: Date.now() });
  await addDoc(collection(db, "rooms", "main", "messages"), {
    type: "system", text: me.name + " group me aaya.", at: serverTimestamp()
  });
  setInterval(() => {
    setDoc(doc(db, "rooms", "main", "members", me.id), { name: me.name, seen: Date.now() }, { merge: true });
  }, 30000);
  listen();
}

async function sendChat(text) {
  await addDoc(collection(db, "rooms", "main", "messages"), {
    type: "chat", userId: me.id, name: me.name, text: text.slice(0, 400), at: serverTimestamp()
  });
}

async function createChallenge(game, mode, note) {
  const ref = doc(collection(db, "rooms", "main", "matches"));
  await setDoc(ref, {
    game, mode, note: note.slice(0, 80),
    hostId: me.id, hostName: me.name,
    guestId: "", guestName: "", code: "", status: "open",
    createdAt: serverTimestamp(), codeAt: null
  });
  await addDoc(collection(db, "rooms", "main", "messages"), {
    type: "challenge", matchId: ref.id, at: serverTimestamp()
  });
}

async function accept(match) {
  if (match.status !== "open" || match.hostId === me.id) return;
  await setDoc(doc(db, "rooms", "main", "matches", match.id), {
    status: "locked", guestId: me.id, guestName: me.name
  }, { merge: true });
  await addDoc(collection(db, "rooms", "main", "messages"), {
    type: "system", text: me.name + " ne " + match.hostName + " ka challenge accept kiya.", at: serverTimestamp()
  });
}

async function shareCode(match, code) {
  if (match.hostId !== me.id || match.status !== "locked") return;
  await setDoc(doc(db, "rooms", "main", "matches", match.id), {
    code: code.replace(/\s/g, "").slice(0, 12).toUpperCase(),
    status: "live",
    codeAt: serverTimestamp()
  }, { merge: true });
  await addDoc(collection(db, "rooms", "main", "messages"), {
    type: "system", text: "Room code live hai. Copy karke join karo. 15 min timer chalu.", at: serverTimestamp()
  });
}

async function finish(match, status) {
  if (match.hostId !== me.id && match.guestId !== me.id) return;
  await setDoc(doc(db, "rooms", "main", "matches", match.id), { status }, { merge: true });
  await addDoc(collection(db, "rooms", "main", "messages"), {
    type: "system",
    text: status === "done" ? "Match complete mark hua." : me.name + " ne match cancel kiya.",
    at: serverTimestamp()
  });
}

function cardHtml(match) {
  const mine = match.hostId === me.id;
  let actions = "";
  if (match.status === "open" && !mine) actions = `<button class="btn small" data-act="accept" data-id="${match.id}">Accept</button>`;
  if (match.status === "open" && mine) actions = `<span class="note">Koi accept kare, tab room code daalna.</span>`;
  if (match.status === "locked" && mine) {
    actions = `<div class="row"><input id="code-${match.id}" placeholder="Room code" maxlength="12" /><button class="btn small gold" data-act="code" data-id="${match.id}">Share</button></div>`;
  }
  if (match.status === "locked" && !mine) actions = `<span class="note">Creator room code daal raha hai.</span>`;
  if (match.status === "live") {
    actions = `<div class="row"><div class="code">${esc(match.code)}</div><button class="btn small" data-act="copy" data-code="${esc(match.code)}">Copy</button></div>
      <div class="row"><span class="timer" data-timer="${match.id}">${remain(match)}</span><span class="note">15 min</span></div>
      <div class="row"><button class="btn small" data-act="done" data-id="${match.id}">Complete</button><button class="btn small ghost" data-act="cancel" data-id="${match.id}">Cancel</button></div>`;
  }
  const who = match.guestName ? match.hostName + " vs " + match.guestName : match.hostName + " · waiting";
  return `<article class="card"><div class="tag">${esc(match.game)} · ${esc(match.mode)}</div><strong>${esc(who)}</strong>${match.note ? `<span class="note">${esc(match.note)}</span>` : ""}<span class="pill">${esc(match.status)}</span>${actions}</article>`;
}

function render() {
  const root = document.getElementById("app");
  if (!me) {
    root.innerHTML = `<div class="gate"><div class="mark">J</div><h1>JokerLudo</h1>
      <p class="lead">Group chat jahan room code share hota hai. Firebase pe real-time. Koi stake nahi, koi wallet nahi.</p>
      <div><label>Tumhara naam</label><input id="name" maxlength="24" placeholder="Rohit" /></div>
      <button class="btn" id="go">Group me jao</button>
      ${error ? `<div class="err">${esc(error)}</div>` : ""}</div>`;
    document.getElementById("go").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      if (!name) return;
      try { await join(name); } catch (e) { error = e.message; render(); }
    };
    return;
  }
  let body = "";
  if (tab === "chat") {
    body = messages.map((m) => {
      if (m.type === "system") return `<div class="sys">${esc(m.text)}</div>`;
      if (m.type === "challenge") {
        const match = matches.find((x) => x.id === m.matchId);
        return match ? cardHtml(match) : "";
      }
      const mine = m.userId === me.id;
      return `<div class="bubble ${mine ? "me" : ""}">${mine ? "" : `<div class="who">${esc(m.name)}</div>`}${esc(m.text)}<span class="time">${time(m.at)}</span></div>`;
    }).join("") || `<div class="sys">Group khali hai. Pehla message bhejo.</div>`;
  }
  if (tab === "matches") {
    body = matches.length ? matches.map((m) => `<div class="list-item">${cardHtml(m)}</div>`).join("") : `<div class="sys">Abhi koi match nahi.</div>`;
  }
  if (tab === "support") {
    body = `<div class="list-item"><strong>Online</strong><span class="note">${members.map((m) => esc(m.name)).join(", ") || "koi nahi"}</span></div>
      <div class="list-item"><strong>Room code</strong><span class="note">Ludo King se code copy karke yahan paste karo. Opponent Copy dabayega.</span></div>
      <div class="list-item"><strong>Rules</strong><span class="note">Yeh social chat hai. Entry fee, pot, ya payout yahan nahi hai.</span></div>`;
  }
  const sheetHtml = sheet ? `<div class="sheet"><form id="ch"><strong>Challenge card</strong>
      <div><label>Game</label><select id="game">${GAMES.map((g) => `<option>${g}</option>`).join("")}</select></div>
      <div><label>Mode</label><select id="mode">${MODES.map((g) => `<option>${g}</option>`).join("")}</select></div>
      <div><label>Note</label><input id="note" maxlength="80" placeholder="2 player" /></div>
      <div class="row"><button type="button" class="btn ghost" id="close">Band</button><button class="btn" type="submit">Create challenge</button></div>
    </form></div>` : "";
  root.innerHTML = `<header class="top"><div class="ava">${esc(me.name.slice(0, 1))}</div><div><h2>JokerLudo</h2><small>${members.length} online · social, no stakes</small></div></header>
    <main id="feed">${error ? `<div class="err">${esc(error)}</div>` : ""}${body}</main>
    ${tab === "chat" ? `<div class="composer"><input id="text" placeholder="Message" maxlength="400" /><button class="btn ghost" id="open-ch">Challenge</button><button class="btn" id="send">Send</button></div>` : ""}
    <nav class="bot">
      <button data-tab="chat" class="${tab === "chat" ? "on" : ""}">Chat</button>
      <button data-tab="matches" class="${tab === "matches" ? "on" : ""}">Matches</button>
      <button data-tab="support" class="${tab === "support" ? "on" : ""}">Support</button>
    </nav>${sheetHtml}`;
  const feed = document.getElementById("feed");
  if (feed) feed.scrollTop = feed.scrollHeight;
  root.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
  const open = document.getElementById("open-ch");
  if (open) open.onclick = () => { sheet = true; render(); };
  const close = document.getElementById("close");
  if (close) close.onclick = () => { sheet = false; render(); };
  const form = document.getElementById("ch");
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    sheet = false;
    tab = "chat";
    await createChallenge(document.getElementById("game").value, document.getElementById("mode").value, document.getElementById("note").value);
  };
  const sendBtn = document.getElementById("send");
  if (sendBtn) sendBtn.onclick = async () => {
    const input = document.getElementById("text");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    await sendChat(text);
  };
  root.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
    const match = matches.find((m) => m.id === b.dataset.id);
    if (b.dataset.act === "copy") {
      try { await navigator.clipboard.writeText(b.dataset.code); b.textContent = "Copied"; } catch { b.textContent = b.dataset.code; }
      return;
    }
    if (b.dataset.act === "accept") return accept(match);
    if (b.dataset.act === "code") return shareCode(match, document.getElementById("code-" + match.id).value);
    if (b.dataset.act === "done") return finish(match, "done");
    if (b.dataset.act === "cancel") return finish(match, "cancelled");
  });
}

setInterval(() => {
  document.querySelectorAll("[data-timer]").forEach((el) => {
    const match = matches.find((m) => m.id === el.dataset.timer);
    if (match) el.textContent = remain(match);
  });
}, 1000);

const saved = localStorage.getItem("jokerludo_name");
if (saved) join(saved).catch((e) => { error = e.message; render(); });
else render();
</script>
</body>
</html>
